name: smoke
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install numpy pillow soundfile "kokoro-onnx>=0.4"
      - run: python studio/get_models.py
      - run: python studio/doctor.py
      - run: python studio/make.py examples/hello-studio --no-burn
      - run: test -s examples/hello-studio/out/final.mp4
